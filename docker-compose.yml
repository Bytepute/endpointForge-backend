version: "3.9"

services:
  db:
    image: postgres:16
    container_name: endpointforge_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: endpointforge_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: endpointforge_api
    restart: always
    depends_on:
      - db
    ports:
      - "4000-5000:4000-5000"
    environment:
      DATABASE_URL: postgresql://postgres:1234@db:5432/endpointforge_db?schema=public
      PORT: 4000

  pgadmin:
    image: dpage/pgadmin4
    container_name: endpointforge_pgadmin
    restart: always
    depends_on:
      - db
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin1234
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  pgadmin_data:
