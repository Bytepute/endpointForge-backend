version: '3.9'

services:
  db:
    image: postgres:16
    container_name: endpointforge_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: endpointforge_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: endpointforge_api
    restart: always
    depends_on:
      - db
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:1234@db:5432/endpointforge_db?schema=public
      PORT: 4000
      JWT_SECRET: B0bZQSJNDIg9UVU0HJLTxWoILinZEINUWptgRYjHnXqXu0M/UkAXlflxlYNhNVJfqQNfke4jxvttC2rNy6yT/Q==
      JWT_EXPIRES_IN: 1h
      CORS_ORIGIN: http://localhost:3000,http://localhost:5173
  pgadmin:
    image: dpage/pgadmin4
    container_name: endpointforge_pgadmin
    restart: always
    depends_on:
      - db
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin1234
    ports:
      - '5050:80'
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  migrator:
    build: .
    container_name: endpointforge_migrator
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://postgres:1234@db:5432/endpointforge_db?schema=public
    command: sh -c "pnpm drizzle-kit generate && pnpm drizzle-kit migrate"

volumes:
  postgres_data:
  pgadmin_data:
